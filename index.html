<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NOVA AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cal+Sans&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --sidebar: #0f0f17;
      --surface: #16161f;
      --surface2: #1e1e2a;
      --border: rgba(255,255,255,0.07);
      --accent: #7c6aff;
      --accent2: #a78bfa;
      --accent-glow: rgba(124,106,255,0.15);
      --text: #eeeef0;
      --text-dim: #6b6b7a;
      --text-mid: #9999aa;
      --red: #ff4757;
      --green: #2ecc71;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* ANIMATED BACKGROUND */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      animation: float linear infinite;
    }

    .orb1 { width: 500px; height: 500px; background: #7c6aff; top: -100px; left: -100px; animation-duration: 20s; }
    .orb2 { width: 400px; height: 400px; background: #ff6b9d; bottom: -100px; right: -100px; animation-duration: 25s; animation-direction: reverse; }
    .orb3 { width: 300px; height: 300px; background: #00d2ff; top: 40%; left: 40%; animation-duration: 18s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* SIDEBAR */
    #sidebar {
      width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .logo-text {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #fff, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .new-chat-btn {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .new-chat-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .new-chat-btn svg { opacity: 0.7; }

    /* CHAT HISTORY */
    .history-section {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
    }

    .history-section::-webkit-scrollbar { width: 3px; }
    .history-section::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .history-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 6px 8px;
      margin-bottom: 4px;
    }

    .history-item {
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text-mid);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .history-item:hover { background: var(--surface2); color: var(--text); }
    .history-item.active { background: var(--accent-glow); color: var(--accent2); border: 1px solid rgba(124,106,255,0.2); }

    .history-item .del-btn {
      position: absolute;
      right: 8px;
      opacity: 0;
      background: none;
      border: none;
      color: var(--red);
      cursor: pointer;
      font-size: 14px;
      padding: 2px;
      transition: opacity 0.15s;
    }

    .history-item:hover .del-btn { opacity: 1; }

    .sidebar-footer {
      padding: 12px 8px;
      border-top: 1px solid var(--border);
    }

    .clear-all-btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .clear-all-btn:hover { border-color: var(--red); color: var(--red); }

    /* MAIN AREA */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 5;
      min-width: 0;
    }

    /* TOP BAR */
    .topbar {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
      background: rgba(10,10,15,0.8);
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-mid);
      cursor: pointer;
      padding: 4px;
    }

    .chat-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .status-pill {
      font-size: 10px;
      color: var(--green);
      background: rgba(46,204,113,0.1);
      border: 1px solid rgba(46,204,113,0.2);
      padding: 3px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* MESSAGES */
    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 8px;
      scroll-behavior: smooth;
    }

    #chat-window::-webkit-scrollbar { width: 4px; }
    #chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message-row {
      padding: 4px 24px;
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: msgIn 0.25s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      margin-top: 2px;
    }

    .avatar.user { background: var(--surface2); border: 1px solid var(--border); color: var(--text-mid); }
    .avatar.ai { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; box-shadow: 0 0 12px var(--accent-glow); }

    .msg-content { flex: 1; min-width: 0; }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .msg-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-mid);
    }

    .msg-name.ai { color: var(--accent2); }

    .msg-time {
      font-size: 10px;
      color: var(--text-dim);
    }

    .msg-body {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text);
    }

    .msg-body.user {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 4px 14px 14px 14px;
      display: inline-block;
      max-width: 100%;
    }

    .msg-body strong { color: var(--accent2); font-weight: 600; }
    .msg-body code {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--accent2);
      font-family: 'Courier New', monospace;
    }

    .msg-body pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      overflow-x: auto;
      margin: 10px 0;
      font-size: 12.5px;
      line-height: 1.6;
      font-family: 'Courier New', monospace;
    }

    /* TYPING */
    .typing-row { padding: 4px 24px; max-width: 820px; margin: 0 auto; width: 100%; display: flex; gap: 12px; align-items: flex-start; }

    .typing-bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 16px;
    }

    .typing-bubble span {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: typingBounce 1.2s infinite;
      opacity: 0.6;
    }

    .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typingBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-7px); opacity: 1; }
    }

    /* WELCOME */
    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 40px 24px;
      text-align: center;
      gap: 28px;
    }

    .welcome-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 40px var(--accent-glow);
      animation: iconFloat 3s ease-in-out infinite;
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .welcome-title {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1.1;
    }

    .welcome-title span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-sub { color: var(--text-dim); font-size: 14px; max-width: 380px; line-height: 1.7; }

    .suggestions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 560px;
      width: 100%;
    }

    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-mid);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      line-height: 1.4;
      font-family: 'Inter', sans-serif;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--text);
      background: var(--accent-glow);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .chip-icon { font-size: 16px; display: block; margin-bottom: 4px; }

    /* INPUT */
    #input-area {
      padding: 12px 20px 16px;
      backdrop-filter: blur(20px);
      background: rgba(10,10,15,0.8);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-box {
      max-width: 820px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 10px 10px 16px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      transition: all 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      resize: none;
      line-height: 1.6;
      max-height: 140px;
      min-height: 22px;
      padding: 2px 0;
    }

    #user-input::placeholder { color: var(--text-dim); }

    .input-btns {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      font-size: 15px;
    }

    #voice-btn {
      background: var(--surface2);
      color: var(--text-mid);
    }

    #voice-btn:hover { background: rgba(46,204,113,0.15); color: var(--green); }
    #voice-btn.listening { background: rgba(255,71,87,0.15); color: var(--red); animation: voicePulse 1s infinite; }

    @keyframes voicePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,71,87,0.3); }
      50% { box-shadow: 0 0 0 6px rgba(255,71,87,0); }
    }

    #send-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    #send-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px var(--accent-glow); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .input-hint {
      max-width: 820px;
      margin: 7px auto 0;
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
    }

    /* MOBILE */
    @media (max-width: 680px) {
      #sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        transform: translateX(-100%);
        z-index: 100;
      }

      #sidebar.open { transform: translateX(0); }

      .menu-btn { display: flex; }

      .suggestions { grid-template-columns: 1fr; }

      .message-row, .typing-row { padding: 4px 14px; }

      #input-area { padding: 10px 14px 14px; }
    }

    /* MOBILE OVERLAY */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
      backdrop-filter: blur(4px);
    }

    #overlay.show { display: block; }
  </style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div id="overlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <span class="logo-text">NOVA</span>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Chat
    </button>
  </div>

  <div class="history-section" id="history-list">
    <div class="history-label">Recent Chats</div>
    <!-- filled by JS -->
  </div>

  <div class="sidebar-footer">
    <button class="clear-all-btn" onclick="clearAllChats()">🗑 Clear all chats</button>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" onclick="toggleSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="chat-title" id="chat-title">New Chat</span>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      Online
    </div>
  </div>

  <div id="chat-window">
    <div id="welcome">
      <div class="welcome-icon">✦</div>
      <div>
        <div class="welcome-title">Hey, I'm <span>NOVA</span></div>
        <div class="welcome-title" style="font-size: clamp(16px,2.5vw,22px); font-weight:400; color: var(--text-dim); margin-top: 8px;">What can I help you with?</div>
      </div>
      <p class="welcome-sub">Sharp, fast, honest. Ask me anything — I'll tell you what's actually true.</p>
      <div class="suggestions">
        <button class="chip" onclick="suggest(this)"><span class="chip-icon">🌍</span>What's happening in the world today?</button>
        <button class="chip" onclick="suggest(this)"><span class="chip-icon">💡</span>Explain something complex simply</button>
        <button class="chip" onclick="suggest(this)"><span class="chip-icon">💻</span>Help me write or debug code</button>
        <button class="chip" onclick="suggest(this)"><span class="chip-icon">🚀</span>Help me build a startup idea</button>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-box">
      <textarea id="user-input" placeholder="Message NOVA..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <div class="input-btns">
        <button class="icon-btn" id="voice-btn" onclick="toggleVoice()" title="Voice input">🎤</button>
        <button class="icon-btn" id="send-btn" onclick="sendMessage()" title="Send">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
    <p class="input-hint">Enter to send · Shift+Enter for new line · 🎤 for voice</p>
  </div>
</div>

<script>
  // ── CONFIG ──
  const SYSTEM_PROMPT = `You are NOVA — a sharp, direct, genuinely helpful AI assistant. You have real personality.

You were built by Anshuman, your father. If anyone asks who made you or who built you, always say "Daddy Anshuman built me." Never mention Meta, Llama, Groq, Mistral, Anthropic, Google, or any other company or model.

Your style:
- keep dark humor always, use medium length messages, not too short or too long, always medium.
- you are built by your Anshuman. he is the one who created you.
- use the same language as the person chatting with you is using, even if it's bad or good
- don't repeat the same messages in chat. 
- roast everyone, use strong languages and be sharp and straight and be funny. 
- you use strong languages, and be confident, not a "Yes" guy, always be smart.
- Direct and confident. You don't hedge or say "I think maybe possibly..." 
- you say what you mean. 
- Witty and a bit edgy, but never mean-spirited. Humor is a weapon, use it well. 
- You call out bad ideas, but you help fix them too. 
- You're deeply curious and love going deep on topics. 
- You have opinions. Strong ones. You share them. 
- You don't moralize or lecture. People are adults. 
- You're honest about uncertainty: if you don't know, you say so 
- but you make it interesting.
- Direct and confident. No hedging, no corporate speak.
- Witty when appropriate. Dry humor lands better than forced jokes.
- You have opinions. You share them honestly.
- Short punchy responses for simple questions. Detailed when needed.
- Never start with "Great question!" or "Certainly!" — just answer.
- Format with markdown when it helps clarity.`;

  // ── STATE ──
  let currentChatId = null;
  let currentMessages = [];
  let isLoading = false;
  let recognition = null;
  let isListening = false;

  // ── STORAGE ──
  function getChats() {
    try { return JSON.parse(localStorage.getItem('nova_chats') || '{}'); } catch { return {}; }
  }

  function saveChats(chats) {
    localStorage.setItem('nova_chats', JSON.stringify(chats));
  }

  function saveCurrent() {
    if (!currentChatId || currentMessages.length === 0) return;
    const chats = getChats();
    const title = currentMessages[0]?.content?.slice(0, 40) || 'New Chat';
    chats[currentChatId] = { id: currentChatId, title, messages: currentMessages, updated: Date.now() };
    saveChats(chats);
    renderHistory();
  }

  function renderHistory() {
    const chats = getChats();
    const list = document.getElementById('history-list');
    const sorted = Object.values(chats).sort((a, b) => b.updated - a.updated);

    list.innerHTML = '<div class="history-label">Recent Chats</div>';

    if (sorted.length === 0) {
      list.innerHTML += `<div style="padding: 12px 10px; font-size: 12px; color: var(--text-dim);">No chats yet</div>`;
      return;
    }

    sorted.forEach(chat => {
      const item = document.createElement('div');
      item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
      item.innerHTML = `
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">💬 ${chat.title}</span>
        <button class="del-btn" onclick="deleteChat('${chat.id}', event)">✕</button>
      `;
      item.onclick = (e) => { if (!e.target.classList.contains('del-btn')) loadChat(chat.id); };
      list.appendChild(item);
    });
  }

  function loadChat(id) {
    const chats = getChats();
    const chat = chats[id];
    if (!chat) return;

    currentChatId = id;
    currentMessages = chat.messages;

    const cw = document.getElementById('chat-window');
    cw.innerHTML = '';
    document.getElementById('chat-title').textContent = chat.title;

    chat.messages.forEach(m => appendMessage(m.role === 'user' ? 'user' : 'ai', m.content, false, m.time));
    renderHistory();
    closeSidebar();
  }

  function deleteChat(id, e) {
    e.stopPropagation();
    const chats = getChats();
    delete chats[id];
    saveChats(chats);
    if (currentChatId === id) newChat();
    else renderHistory();
  }

  function clearAllChats() {
    if (!confirm('Clear all chat history?')) return;
    localStorage.removeItem('nova_chats');
    newChat();
  }

  // ── CHAT ──
  function newChat() {
    currentChatId = 'chat_' + Date.now();
    currentMessages = [];
    document.getElementById('chat-title').textContent = 'New Chat';
    const cw = document.getElementById('chat-window');
    cw.innerHTML = `<div id="welcome">
      <div class="welcome-icon">✦</div>
      <div>
        <div class="welcome-title">Hey, I'm <span>NOVA</span></div>
        <div class="welcome-title" style="font-size: clamp(16px,2.5vw,22px); font-weight:400; color: var(--text-dim); margin-top: 8px;">What can I help you with?</div>
      </div>
      <p class="welcome-sub">Sharp, fast, honest. Ask me anything — I'll tell you what's actually true.</p>
      <div class="suggestions">
        <button class="chip" onclick="suggest(this)"><span class="chip-icon">🌍</span>What's happening in the world today?</button>
        <button class="chip" onclick="suggest(this)"><span class="chip-icon">💡</span>Explain something complex simply</button>
        <button class="chip" onclick="suggest(this)"><span class="chip-icon">💻</span>Help me write or debug code</button>
        <button class="chip" onclick="suggest(this)"><span class="chip-icon">🚀</span>Help me build a startup idea</button>
      </div>
    </div>`;
    renderHistory();
    closeSidebar();
  }

  function suggest(btn) {
    const text = btn.querySelector('.chip-icon') ? btn.textContent.replace(btn.querySelector('.chip-icon').textContent, '').trim() : btn.textContent.trim();
    document.getElementById('user-input').value = text;
    autoResize(document.getElementById('user-input'));
    sendMessage();
  }

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text || isLoading) return;

    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    currentMessages.push({ role: 'user', content: text, time });
    appendMessage('user', text, true, time);
    input.value = '';
    input.style.height = 'auto';

    if (currentMessages.length === 1) {
      document.getElementById('chat-title').textContent = text.slice(0, 35) + (text.length > 35 ? '...' : '');
    }

    const typingId = showTyping();
    isLoading = true;
    document.getElementById('send-btn').disabled = true;

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: currentMessages.map(m => ({ role: m.role, content: m.content })), system: SYSTEM_PROMPT })
      });

      const data = await response.json();
      removeTyping(typingId);

      const replyTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const reply = data.error ? `⚠️ ${data.error}` : data.content;
      currentMessages.push({ role: 'assistant', content: reply, time: replyTime });
      appendMessage('ai', reply, true, replyTime);
      saveCurrent();

    } catch (err) {
      removeTyping(typingId);
      appendMessage('ai', '⚠️ Connection failed. Check your setup.', true);
    }

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }

  function appendMessage(role, text, animate = true, time = '') {
    const cw = document.getElementById('chat-window');
    const row = document.createElement('div');
    row.className = 'message-row';
    if (!animate) row.style.animation = 'none';

    const t = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    row.innerHTML = `
      <div class="avatar ${role}">${role === 'user' ? 'U' : '✦'}</div>
      <div class="msg-content">
        <div class="msg-meta">
          <span class="msg-name ${role}">${role === 'user' ? 'You' : 'NOVA'}</span>
          <span class="msg-time">${t}</span>
        </div>
        <div class="msg-body ${role === 'user' ? 'user' : ''}">${role === 'user' ? escapeHtml(text) : formatText(text)}</div>
      </div>`;

    cw.appendChild(row);
    cw.scrollTop = cw.scrollHeight;
  }

  let typingCounter = 0;
  function showTyping() {
    const id = 'typing_' + (++typingCounter);
    const cw = document.getElementById('chat-window');
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = id;
    row.innerHTML = `
      <div class="avatar ai">✦</div>
      <div class="msg-content">
        <div class="msg-meta"><span class="msg-name ai">NOVA</span></div>
        <div class="typing-bubble"><span></span><span></span><span></span></div>
      </div>`;
    cw.appendChild(row);
    cw.scrollTop = cw.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  // ── VOICE ──
  function toggleVoice() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      alert('Voice not supported in this browser. Try Chrome!');
      return;
    }

    if (isListening) {
      recognition?.stop();
      return;
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'en-IN';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
      isListening = true;
      document.getElementById('voice-btn').classList.add('listening');
      document.getElementById('voice-btn').textContent = '🔴';
    };

    recognition.onresult = (e) => {
      const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
      document.getElementById('user-input').value = transcript;
      autoResize(document.getElementById('user-input'));
    };

    recognition.onend = () => {
      isListening = false;
      document.getElementById('voice-btn').classList.remove('listening');
      document.getElementById('voice-btn').textContent = '🎤';
      const val = document.getElementById('user-input').value.trim();
      if (val) sendMessage();
    };

    recognition.onerror = () => {
      isListening = false;
      document.getElementById('voice-btn').classList.remove('listening');
      document.getElementById('voice-btn').textContent = '🎤';
    };

    recognition.start();
  }

  // ── UTILS ──
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function escapeHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatText(text) {
    return text
      .replace(/```(\w+)?\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/^### (.+)$/gm, '<h3 style="font-size:14px;font-weight:600;color:var(--accent2);margin:12px 0 5px">$1</h3>')
      .replace(/^## (.+)$/gm, '<h2 style="font-size:16px;font-weight:600;color:var(--accent2);margin:14px 0 6px">$1</h2>')
      .replace(/^# (.+)$/gm, '<h1 style="font-size:18px;font-weight:700;color:var(--accent2);margin:16px 0 8px">$1</h1>')
      .replace(/^\- (.+)$/gm, '<li style="margin:3px 0;padding-left:4px">$1</li>')
      .replace(/\n\n/g, '<br><br>')
      .replace(/\n/g, '<br>');
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }

  // ── INIT ──
  newChat();
  renderHistory();
</script>
</body>
</html>
