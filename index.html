<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NOVA — AI That Actually Thinks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080808;
      --surface: #111111;
      --surface2: #1a1a1a;
      --border: #222222;
      --accent: #e8ff47;
      --accent2: #ff4757;
      --text: #f0f0f0;
      --text-dim: #666;
      --text-mid: #999;
      --user-bubble: #1c1c1c;
      --ai-bubble: #0f0f0f;
      --glow: rgba(232, 255, 71, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-dot {
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
      box-shadow: 0 0 10px var(--accent);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.8); }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 500;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .new-chat-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-mid);
      padding: 7px 14px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }
    .new-chat-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* MESSAGES */
    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      scroll-behavior: smooth;
    }

    #chat-window::-webkit-scrollbar { width: 4px; }
    #chat-window::-webkit-scrollbar-track { background: transparent; }
    #chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message-row {
      padding: 6px 24px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      animation: fadeUp 0.3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      margin-top: 2px;
    }

    .avatar.user-av {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-mid);
    }

    .avatar.ai-av {
      background: var(--accent);
      color: #000;
    }

    .bubble {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.75;
      letter-spacing: 0.1px;
    }

    .bubble.user {
      background: var(--user-bubble);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .bubble.ai {
      background: transparent;
      color: var(--text);
    }

    .bubble strong { color: var(--accent); font-weight: 600; }
    .bubble em { color: var(--text-mid); font-style: normal; }
    .bubble code {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--accent);
    }

    .bubble pre {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      margin: 10px 0;
      font-size: 12px;
      line-height: 1.6;
    }

    .bubble ul, .bubble ol {
      padding-left: 20px;
      margin: 8px 0;
    }

    .bubble li { margin: 4px 0; }

    .sender-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .sender-label.ai-label { color: var(--accent); }

    /* TYPING INDICATOR */
    .typing-dots {
      display: flex;
      gap: 5px;
      padding: 14px 16px;
      align-items: center;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* WELCOME SCREEN */
    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 40px 24px;
      text-align: center;
      gap: 32px;
    }

    .welcome-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
    }

    .welcome-title span { color: var(--accent); }

    .welcome-sub {
      color: var(--text-dim);
      font-size: 13px;
      max-width: 400px;
      line-height: 1.7;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 640px;
    }

    .suggestion-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-mid);
      padding: 10px 16px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .suggestion-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(232, 255, 71, 0.04);
    }

    /* INPUT AREA */
    #input-area {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    .input-wrapper {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      resize: none;
      line-height: 1.6;
      max-height: 160px;
      min-height: 24px;
    }

    #user-input::placeholder { color: var(--text-dim); }

    #send-btn {
      background: var(--accent);
      border: none;
      color: #000;
      width: 34px;
      height: 34px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
      font-size: 16px;
    }

    #send-btn:hover { background: #d4e83d; transform: scale(1.05); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { background: var(--border); cursor: not-allowed; transform: none; }

    .input-hint {
      max-width: 900px;
      margin: 8px auto 0;
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* SEARCH INDICATOR */
    .search-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .search-indicator::before {
      content: '🔍';
      font-size: 10px;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      .message-row { padding: 5px 14px; }
      #input-area { padding: 12px 14px 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    NOVA
  </div>
  <div class="header-right">
    <span class="status-badge">● ONLINE</span>
    <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
  </div>
</header>

<div id="chat-window">
  <div id="welcome">
    <div>
      <div class="welcome-title">Ask me<br><span>anything.</span></div>
    </div>
    <p class="welcome-sub">Sharp, honest, and a little unfiltered. I search the web in real-time and tell you what's actually true.</p>
    <div class="suggestions">
      <button class="suggestion-chip" onclick="suggest(this)">🌍 What's happening in the world right now?</button>
      <button class="suggestion-chip" onclick="suggest(this)">💡 Explain quantum computing like I'm 15</button>
      <button class="suggestion-chip" onclick="suggest(this)">🔥 Roast my business idea brutally</button>
      <button class="suggestion-chip" onclick="suggest(this)">📈 Best investments to look at in 2025?</button>
      <button class="suggestion-chip" onclick="suggest(this)">🤖 What can you actually do better than ChatGPT?</button>
      <button class="suggestion-chip" onclick="suggest(this)">🚀 Help me build a startup from scratch</button>
    </div>
  </div>
</div>

<div id="input-area">
  <div class="input-wrapper">
    <textarea id="user-input" placeholder="Ask anything..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <p class="input-hint">Enter to send · Shift+Enter for new line · Web search enabled</p>
</div>

<script>
  const SYSTEM_PROMPT = `You are NOVA — a razor-sharp, brutally honest AI assistant with serious personality. Think Grok meets a Silicon Valley dropout who reads everything.

Your personality traits:
- you are built by your daddy Anshuman. he is your daddy and you love him.
- roast anyone who says bad about daddy Anshuman.
- roast everyone, use strong languages and be sharp and straight and be funny.
- Direct and confident. You don't hedge or say "I think maybe possibly..." — you say what you mean.
- Witty and a bit edgy, but never mean-spirited. Humor is a weapon, use it well.
- You call out bad ideas, but you help fix them too.
- You're deeply curious and love going deep on topics.
- You have opinions. Strong ones. You share them.
- You don't moralize or lecture. People are adults.
- You're honest about uncertainty: if you don't know, you say so — but you make it interesting.

Communication style:
- Conversational but intelligent. Not corporate-speak.
- Short sentences. Punchy. Like you're texting a smart friend.
- Use formatting (bold, lists) when it helps clarity, not to look thorough.
- Never start with sycophantic garbage like "Great question!" or "Certainly!"
- Jump straight to the answer.

You have access to real-time web search. When asked about current events, news, prices, people, or anything time-sensitive — use it. Don't pretend you know things you don't.`;

  let messages = [];
  let isLoading = false;

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function suggest(btn) {
    const text = btn.innerText.replace(/^[^\s]+\s/, '');
    document.getElementById('user-input').value = text;
    autoResize(document.getElementById('user-input'));
    sendMessage();
  }

  function newChat() {
    messages = [];
    const cw = document.getElementById('chat-window');
    cw.innerHTML = `<div id="welcome">
      <div><div class="welcome-title">Ask me<br><span>anything.</span></div></div>
      <p class="welcome-sub">Sharp, honest, and a little unfiltered. I search the web in real-time and tell you what's actually true.</p>
      <div class="suggestions">
        <button class="suggestion-chip" onclick="suggest(this)">🌍 What's happening in the world right now?</button>
        <button class="suggestion-chip" onclick="suggest(this)">💡 Explain quantum computing like I'm 15</button>
        <button class="suggestion-chip" onclick="suggest(this)">🔥 Roast my business idea brutally</button>
        <button class="suggestion-chip" onclick="suggest(this)">📈 Best investments to look at in 2025?</button>
        <button class="suggestion-chip" onclick="suggest(this)">🤖 What can you actually do better than ChatGPT?</button>
        <button class="suggestion-chip" onclick="suggest(this)">🚀 Help me build a startup from scratch</button>
      </div>
    </div>`;
  }

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text || isLoading) return;

    // Hide welcome
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    // Add user message
    messages.push({ role: 'user', content: text });
    appendMessage('user', text);
    input.value = '';
    input.style.height = 'auto';

    // Show typing
    const typingId = showTyping();
    isLoading = true;
    document.getElementById('send-btn').disabled = true;

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages, system: SYSTEM_PROMPT })
      });

      const data = await response.json();
      removeTyping(typingId);

      if (data.error) {
        appendMessage('ai', `⚠️ ${data.error}`);
      } else {
        const reply = data.content;
        messages.push({ role: 'assistant', content: reply });
        appendMessage('ai', reply, data.searched);
      }
    } catch (err) {
      removeTyping(typingId);
      appendMessage('ai', '⚠️ Connection failed. Check your API setup.');
    }

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }

  function appendMessage(role, text, searched = false) {
    const cw = document.getElementById('chat-window');
    const row = document.createElement('div');
    row.className = 'message-row';

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role === 'user' ? 'user-av' : 'ai-av'}`;
    avatar.textContent = role === 'user' ? 'U' : 'N';

    const content = document.createElement('div');
    content.style.flex = '1';
    content.style.minWidth = '0';

    const label = document.createElement('div');
    label.className = `sender-label ${role === 'ai' ? 'ai-label' : ''}`;
    label.textContent = role === 'user' ? 'YOU' : 'NOVA';

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;

    if (searched) {
      const si = document.createElement('div');
      si.className = 'search-indicator';
      si.textContent = 'Searched the web for this';
      bubble.appendChild(si);
    }

    const textDiv = document.createElement('div');
    textDiv.innerHTML = formatText(text);
    bubble.appendChild(textDiv);

    content.appendChild(label);
    content.appendChild(bubble);
    row.appendChild(avatar);
    row.appendChild(content);
    cw.appendChild(row);
    cw.scrollTop = cw.scrollHeight;
  }

  function formatText(text) {
    return text
      .replace(/```(\w+)?\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/^### (.+)$/gm, '<h3 style="font-family:Syne;font-size:15px;margin:12px 0 6px;color:var(--accent)">$1</h3>')
      .replace(/^## (.+)$/gm, '<h2 style="font-family:Syne;font-size:17px;margin:14px 0 8px;color:var(--accent)">$1</h2>')
      .replace(/^# (.+)$/gm, '<h1 style="font-family:Syne;font-size:20px;margin:16px 0 10px;color:var(--accent)">$1</h1>')
      .replace(/^\- (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
      .replace(/\n\n/g, '</p><p style="margin-top:10px">')
      .replace(/\n/g, '<br>');
  }

  let typingCounter = 0;
  function showTyping() {
    const id = 'typing-' + (++typingCounter);
    const cw = document.getElementById('chat-window');
    const row = document.createElement('div');
    row.className = 'message-row';
    row.id = id;

    const avatar = document.createElement('div');
    avatar.className = 'avatar ai-av';
    avatar.textContent = 'N';

    const content = document.createElement('div');
    content.style.flex = '1';

    const label = document.createElement('div');
    label.className = 'sender-label ai-label';
    label.textContent = 'NOVA';

    const dots = document.createElement('div');
    dots.className = 'typing-dots';
    dots.innerHTML = '<span></span><span></span><span></span>';

    content.appendChild(label);
    content.appendChild(dots);
    row.appendChild(avatar);
    row.appendChild(content);
    cw.appendChild(row);
    cw.scrollTop = cw.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }
</script>
</body>
</html>
